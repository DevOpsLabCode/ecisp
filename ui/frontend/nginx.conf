server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router BrowserRouter) -- unknown paths fall
    # back to index.html instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
