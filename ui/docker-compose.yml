# Local/CI stack for ecisp-ui. Run from the repo root or from ui/:
#   docker compose -f ui/docker-compose.yml up --build
#
# Image names/tags are overridable (CI sets these to ghcr.io/... tags so the
# exact images that get smoke-tested here are the ones that get pushed).
services:
  backend:
    build:
      context: ..
      dockerfile: ui/backend/Dockerfile
    image: ${BACKEND_IMAGE:-ecisp-backend:local}
    ports:
      - "8000:8000"
    environment:
      # Must match wherever the browser actually loads the frontend from --
      # see app/main.py. Defaults already cover this compose file's own
      # frontend port (8080); override if you republish it elsewhere.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
    volumes:
      - reports:/app/ui/backend/data/reports
      # Uncomment to enable "profile" auth (including cross-account role
      # assumption for scanning many AWS accounts with one credential --
      # see ui/README.md#scanning-many-accounts-at-once). Mount read-only;
      # the container never needs to write to it.
      # - ${HOME}/.aws:/home/appuser/.aws:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: ${FRONTEND_IMAGE:-ecisp-frontend:local}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reports:
