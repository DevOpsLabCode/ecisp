name: ui-codeql

# Static analysis (SAST) for the ui/ subproject, both ecosystems. Separate
# from ui-ci.yml because CodeQL's init/autobuild/analyze steps follow
# GitHub's own action pattern and read oddly mixed into a general test
# pipeline.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-codeql.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-codeql.yml"
  schedule:
    # Weekly, independent of code changes -- catches newly disclosed query
    # patterns against unchanged code.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ui-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: ui

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
