name: ui-deploy

# Builds the Golem backend + frontend as Docker images, brings the real
# stack online with docker compose, smoke-tests it end to end, and (outside
# of pull requests) publishes the tested images to GHCR.
#
# This intentionally tests-before-publish: images are only pushed if the
# live stack passed its health/smoke/perf checks in this same run.

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "ui/**"
      - "EnterpriseCloudDiscovery/**"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/ui-deploy.yml"
  pull_request:
    paths:
      - "ui/**"
      - "EnterpriseCloudDiscovery/**"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/ui-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: ui-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    name: Build, bring online, test, publish
    runs-on: ubuntu-latest
    # The backend image now bundles five language toolchains (Python, Go,
    # JVM+Maven, Ruby, .NET SDK) for app/orgscan/'s eight SAST scanners,
    # plus Trivy and OWASP ZAP for the code-scan feature, on top of the app
    # itself -- a cold build (no layer cache, e.g. after a Dockerfile
    # change) takes noticeably longer than the old Python-only image did.
    # 20 minutes was cutting it close even before ZAP's ~130MB download.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: tags
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "backend_image=ghcr.io/${repo_lc}-backend:${{ github.sha }}"
            echo "frontend_image=ghcr.io/${repo_lc}-frontend:${{ github.sha }}"
            echo "repo_lc=${repo_lc}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        working-directory: ui
        env:
          BACKEND_IMAGE: ${{ env.backend_image }}
          FRONTEND_IMAGE: ${{ env.frontend_image }}
        run: docker compose build

      - name: Bring the stack online
        working-directory: ui
        env:
          BACKEND_IMAGE: ${{ env.backend_image }}
          FRONTEND_IMAGE: ${{ env.frontend_image }}
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "backend never became healthy"; exit 1

      - name: Smoke test backend API
        run: |
          set -e
          curl -sf http://localhost:8000/api/health > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -sf http://localhost:8000/api/providers > /tmp/providers.json
          count=$(python3 -c "import json; print(len(json.load(open('/tmp/providers.json'))))")
          test "$count" = "7"

      - name: Smoke test a real scan job through the engine
        # /api/health and /api/providers never actually call the engine's
        # run() -- only a real scan job does. It's expected to fail (no
        # real AWS profile exists in CI), but it must fail on the engine's
        # own authentication error, not crash on our side of the
        # integration (e.g. the worker-thread asyncio event-loop bug this
        # guards against: https://github.com/${{ github.repository }} run
        # history for the details).
        run: |
          set -e
          job_id=$(curl -sf -X POST http://localhost:8000/api/scans \
            -H 'content-type: application/json' \
            -d '{"provider":"aws","auth_method":"profile","auth":{"profile":"ci-smoke-test-nonexistent"},"report_name":"ci-smoke-scan"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for _ in $(seq 1 30); do
            status=$(curl -sf "http://localhost:8000/api/scans/$job_id" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = "completed" ] || [ "$status" = "failed" ] && break
            sleep 1
          done
          detail=$(curl -sf "http://localhost:8000/api/scans/$job_id")
          echo "$detail" | python3 -m json.tool
          echo "$detail" > /tmp/scan_detail.json
          python3 ui/perf/assert_scan_ran.py /tmp/scan_detail.json

      - name: Smoke test a real code-scan upload through the pipeline
        # Exercises the archive-upload SAST/SCA/Secrets pipeline end to end
        # against the live container -- not mocked, so this is the one place
        # CI actually runs Trivy (and whichever other scanners tech_detect
        # matches) for real, against a real .zip.
        run: |
          set -e
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/smoke.zip', 'w') as zf:
              zf.writestr('smoke-proj/requirements.txt', 'flask==0.12\n')
              zf.writestr('smoke-proj/app.py', 'print(\"hello\")\n')
          "
          scan_id=$(curl -sf -X POST http://localhost:8000/api/code-scans/upload \
            -F "file=@/tmp/smoke.zip;type=application/zip" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for _ in $(seq 1 60); do
            status=$(curl -sf "http://localhost:8000/api/code-scans/$scan_id" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = "completed" ] || [ "$status" = "failed" ] && break
            sleep 1
          done
          detail=$(curl -sf "http://localhost:8000/api/code-scans/$scan_id")
          echo "$detail" | python3 -m json.tool
          echo "$detail" > /tmp/code_scan_detail.json
          python3 -c "
          import json
          d = json.load(open('/tmp/code_scan_detail.json'))
          assert d['status'] == 'completed', f\"expected completed, got {d['status']!r}: {d.get('error')}\"
          assert d['source_type'] == 'upload'
          assert 'trivy' in d['scanners_run'] or 'trivy' in d['scanners_skipped'], 'trivy did not run or record a skip reason'
          print('code-scan upload smoke test passed:', d['finding_count'], 'findings')
          "
          curl -sf "http://localhost:8000/api/code-scans/$scan_id/report.sarif" -o /tmp/code_scan_report.sarif
          python3 -c "
          import json
          report = json.load(open('/tmp/code_scan_report.sarif'))
          assert report['runs'], 'SARIF report has no runs'
          print('report.sarif downloaded and parses as valid SARIF')
          "

      - name: Smoke test a real registry scan through the pipeline
        # Exercises the container-image scan pipeline end to end against the
        # live container -- a real anonymous pull + `trivy image` run against
        # a real public image (alpine:3.18, kept small so this stays fast;
        # the vulnerability DB is already warm from the code-scan smoke test
        # above, both running inside the same backend container this job).
        run: |
          set -e
          scan_id=$(curl -sf -X POST http://localhost:8000/api/registry-scans \
            -H 'content-type: application/json' \
            -d '{"image_ref":"alpine:3.18"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for _ in $(seq 1 60); do
            status=$(curl -sf "http://localhost:8000/api/registry-scans/$scan_id" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = "completed" ] || [ "$status" = "failed" ] && break
            sleep 1
          done
          detail=$(curl -sf "http://localhost:8000/api/registry-scans/$scan_id")
          echo "$detail" | python3 -m json.tool
          echo "$detail" > /tmp/registry_scan_detail.json
          python3 -c "
          import json
          d = json.load(open('/tmp/registry_scan_detail.json'))
          assert d['status'] == 'completed', f\"expected completed, got {d['status']!r}: {d.get('error')}\"
          assert d['image_ref'] == 'alpine:3.18'
          print('registry scan smoke test passed:', d['finding_count'], 'findings')
          "
          curl -sf "http://localhost:8000/api/registry-scans/$scan_id/report.sarif" -o /tmp/registry_scan_report.sarif
          python3 -c "
          import json
          report = json.load(open('/tmp/registry_scan_report.sarif'))
          assert report['runs'], 'SARIF report has no runs'
          print('report.sarif downloaded and parses as valid SARIF')
          "

      - name: Smoke test frontend
        run: |
          set -e
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ -o /tmp/index.html && break
            sleep 1
          done
          grep -qi "golem" /tmp/index.html

      - name: Install k6
        # grafana/k6-action runs k6 inside its own Docker container, which
        # is on a different network namespace than the runner -- its
        # "localhost" isn't the runner's localhost where docker-compose
        # published our ports. Installing the k6 binary directly onto the
        # runner instead means it shares the runner's network, matching
        # local `docker compose up` + `k6 run` usage exactly.
        uses: grafana/setup-k6-action@v1

      - name: k6 latency smoke test against the live stack
        run: k6 run ui/perf/k6-backend-smoke.js
        env:
          BASE_URL: http://localhost:8000

      - name: Stack logs
        if: always()
        working-directory: ui
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: ui
        env:
          BACKEND_IMAGE: ${{ env.backend_image }}
          FRONTEND_IMAGE: ${{ env.frontend_image }}
        run: docker compose down -v

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push "${{ env.backend_image }}"
          docker push "${{ env.frontend_image }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${{ env.backend_image }}" "ghcr.io/${{ env.repo_lc }}-backend:latest"
            docker tag "${{ env.frontend_image }}" "ghcr.io/${{ env.repo_lc }}-frontend:latest"
            docker push "ghcr.io/${{ env.repo_lc }}-backend:latest"
            docker push "ghcr.io/${{ env.repo_lc }}-frontend:latest"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## ui-deploy"
            echo "- Backend image: \`${{ env.backend_image }}\`"
            echo "- Frontend image: \`${{ env.frontend_image }}\`"
            echo "- Published: $([ '${{ github.event_name }}' != 'pull_request' ] && echo yes || echo 'no (pull_request build, test-only)')"
          } >> "$GITHUB_STEP_SUMMARY"
